  <title>Playwright Report</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #fafafa;
      --border: #e5e5e5;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --passed: #1a7f37;
      --failed: #cf222e;
      --skipped: #bf8700;
      --accent: #007acc;
      --sidebar-width: 320px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .title { font-size: 1.1rem; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 0.85rem; }
    .stats { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .stat {
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    .stat.passed { color: var(--passed); }
    .stat.failed { color: var(--failed); }
    .stat.skipped { color: var(--skipped); }
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: calc(100vh - 58px);
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow: auto;
    }
    .search {
      width: calc(100% - 1rem);
      margin: 0.75rem 0.5rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }
    .test-list { list-style: none; margin: 0; padding: 0 0 1rem; }
    .test-item {
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .test-item:hover, .test-item.active { background: #eef6ff; }
    .test-item-title {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      font-size: 0.88rem;
      line-height: 1.35;
    }
    .badge {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-top: 0.35rem;
      flex: 0 0 auto;
    }
    .badge.passed { background: var(--passed); }
    .badge.failed { background: var(--failed); }
    .badge.skipped { background: var(--skipped); }
    .test-meta {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .content { padding: 1.25rem 1.5rem 2rem; overflow: auto; }
    .empty {
      color: var(--muted);
      padding: 2rem;
      text-align: center;
    }
    .detail-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    .detail-subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      word-break: break-word;
    }
    .tag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .tag {
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #eef2ff;
      color: #3730a3;
    }
    .steps {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .step {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      gap: 0.75rem;
      align-items: start;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .step:last-child { border-bottom: 0; }
    .step-name { font-size: 0.92rem; }
    .step-duration { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
    .step-error {
      grid-column: 2 / -1;
      margin-top: 0.35rem;
      padding: 0.75rem;
      border-radius: 6px;
      background: #fff5f5;
      color: #7f1d1d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .screenshot {
      margin-top: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .screenshot img {
      display: block;
      width: 100%;
      height: auto;
    }
    .screenshot-caption {
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    .logs-panel {
      margin-top: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .logs-header {
      padding: 0.65rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      background: #f3f4f6;
      border-bottom: 1px solid var(--border);
    }
    .logs-content {
      margin: 0;
      padding: 0.85rem 1rem;
      max-height: 420px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      background: #111827;
      color: #e5e7eb;
    }
    .log-line { display: block; }
    .log-time { color: #9ca3af; }
    .log-source { color: #93c5fd; }
    .log-level-warn { color: #fbbf24; }
    .log-level-error { color: #f87171; }
    .log-level-browser { color: #a5b4fc; }
    .logs-empty {
      padding: 0.85rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--border); max-height: 40vh; }
    }
  </style>
</head>

    function formatDuration(ns) {
      const ms = Number(ns || 0) / 1e6;
      if (ms >= 60000) return (ms / 60000).toFixed(1) + 'm';
      if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
      return Math.max(1, Math.round(ms)) + 'ms';
    }

    function formatElapsed(ms) {
      const value = Number(ms || 0);
      if (value >= 1000) return '+' + (value / 1000).toFixed(1) + 's';
      return '+' + Math.max(0, Math.round(value)) + 'ms';
    }

    function renderLogs(logs) {
      if (!logs || logs.length === 0) {
        return '<div class="logs-panel"><div class="logs-header">Stdout</div><div class="logs-empty">No logs captured for this test.</div></div>';
      }

      const lines = logs.map((entry) => {
        const levelClass = entry.source === 'browser'
          ? 'log-level-browser'
          : entry.level === 'warn' || entry.level === 'warning'
            ? 'log-level-warn'
            : entry.level === 'error'
              ? 'log-level-error'
              : '';
        const source = entry.source || 'stdout';
        const safeMessage = String(entry.message || '').replace(/</g, '&lt;');
        return '<span class="log-line">' +
          '<span class="log-time">' + formatElapsed(entry.elapsedMs) + '</span> ' +
          '<span class="log-source">[' + source + ']</span> ' +
          '<span class="' + levelClass + '">' + safeMessage + '</span>' +
        '</span>';
      }).join('\n');

      return '<div class="logs-panel"><div class="logs-header">Stdout</div><pre class="logs-content">' + lines + '</pre></div>';
    }

    function renderDetail(test) {
      const tags = (test.tags || []).map((tag) => '<span class="tag">' + tag + '</span>').join('');
      const steps = (test.steps || []).map((step) => {
        const error = step.error
          ? '<div class="step-error">' + step.error.replace(/</g, '&lt;') + '</div>'
          : '';
        return '<div class="step">' +
          '<span class="badge ' + step.status + '"></span>' +
          '<div class="step-name">' + step.name + error + '</div>' +
          '<div class="step-duration">' + formatDuration(step.duration) + '</div>' +
        '</div>';
      }).join('');

      const screenshot = test.screenshot
        ? '<div class="screenshot"><img src="' + test.screenshot + '" alt="Failure screenshot" /><div class="screenshot-caption">Screenshot on failure</div></div>'
        : '';

      contentEl.innerHTML =
        '<h2 class="detail-title">' + test.name + '</h2>' +
        '<div class="detail-subtitle">' + test.feature + ' · ' + test.uri + '</div>' +
        '<div class="tag-row">' + tags + '</div>' +
        '<div class="steps">' + steps + '</div>' +
        renderLogs(test.logs) +
        screenshot;
    }

    function renderList(filter = '') {
      const query = filter.trim().toLowerCase();
      listEl.innerHTML = tests
        .filter((test) => {
          if (!query) return true;
          return [test.name, test.feature, test.runLabel, ...(test.tags || []), ...((test.logs || []).map((entry) => entry.message))]
            .join(' ')
            .toLowerCase()
            .includes(query);
        })
        .map((test) => {
          const active = test.id === activeId ? ' active' : '';
          return '<li class="test-item' + active + '" data-id="' + test.id + '">' +
            '<div class="test-item-title">' +
              '<span class="badge ' + test.status + '"></span>' +
              '<span>' + test.name + '</span>' +
            '</div>' +
            '<div class="test-meta">' + test.runLabel + ' · ' + formatDuration(test.duration) + '</div>' +
          '</li>';
        })
        .join('');

      listEl.querySelectorAll('.test-item').forEach((item) => {
        item.addEventListener('click', () => {
          activeId = item.dataset.id;
          renderList(searchEl.value);
          const selected = tests.find((test) => test.id === activeId);
          if (selected) renderDetail(selected);
        });
      });
    }

    searchEl.addEventListener('input', (event) => renderList(event.target.value));

    if (tests.length === 0) {
      contentEl.innerHTML = '<div class="empty">No executed tests found in this session.</div>';
    } else {
      renderList();
      renderDetail(tests.find((test) => test.id === activeId) || tests[0]);
    }
  </script>
</body>
</html>
